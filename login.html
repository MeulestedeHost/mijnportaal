<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panini Ruilportaal — Aanmelden</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="brand">
        <span class="brand__logo">◆</span>
        <span class="brand__name">Panini Ruilportaal</span>
      </a>
    </div>
  </header>

  <main class="container main">
    <div class="card login-card">
      <h1>Aanmelden</h1>
      <p class="login-card__hint">
        Voer je e-mailadres in. We sturen je een magic link waarmee je zonder wachtwoord inlogt.
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">E-mailadres</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="naam@voorbeeld.nl"
            required
            autocomplete="email"
          />
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="login-btn">
          Magic link versturen
        </button>
      </form>

      <div id="message" class="message" role="alert" aria-live="polite"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Panini Ruilportaal — Gebouwd op Cloudflare Pages &amp; Supabase</p>
    </div>
  </footer>

  <script type="module" src="/js/supabase.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
