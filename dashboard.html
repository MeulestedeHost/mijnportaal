<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panini Ruilportaal — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/dashboard.html" class="brand">
        <span class="brand__logo">◆</span>
        <span class="brand__name">Panini Ruilportaal</span>
      </a>
      <div class="navbar__actions">
        <span class="navbar__user">Welkom <span id="user-email"></span></span>
        <button type="button" class="btn btn--outline btn--sm" id="logout-btn">Uitloggen</button>
      </div>
    </div>
  </header>

  <main class="container main">
    <div id="loading" class="loading">Laden…</div>

    <div id="onboarding" class="card hidden">
      <h1>Welkom!</h1>
      <p class="login-card__hint">
        Voeg je eerste verzamelaar toe. Verzamel je zelf mee? Vink dan
        “volwassene” aan en zet jezelf erbij.
      </p>
      <form id="onboarding-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="ob-voornaam" class="form-label">Voornaam <span class="required">*</span></label>
            <input type="text" id="ob-voornaam" class="form-input" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="ob-familienaam" class="form-label">Familienaam <span class="required">*</span></label>
            <input type="text" id="ob-familienaam" class="form-input" required maxlength="100" />
          </div>
          <div class="form-group" id="ob-geboortejaar-groep">
            <label for="ob-geboortejaar" class="form-label">Geboortejaar <span class="required">*</span></label>
            <input type="number" id="ob-geboortejaar" class="form-input" min="1900" max="2100" />
          </div>
        </div>
        <label class="checkbox-rij">
          <input type="checkbox" id="ob-volwassen" />
          <span>Volwassene (bijvoorbeeld jijzelf) — geboortejaar niet nodig</span>
        </label>
        <button type="submit" class="btn btn--primary" id="ob-submit-btn">Verzamelaar toevoegen</button>
      </form>
      <div id="onboarding-message" class="message" role="alert" aria-live="polite"></div>
    </div>

    <div id="main-dashboard" class="hidden">
      <div class="dashboard-header">
        <h1>Mijn verzamelaars</h1>
        <button type="button" class="btn btn--primary" id="new-kind-btn">＋ Verzamelaar toevoegen</button>
      </div>

      <div id="kind-form-container" class="card hidden">
        <h2 id="kind-form-title">Nieuwe verzamelaar</h2>
        <form id="kind-form" novalidate>
          <input type="hidden" id="kind-id" />
          <div class="form-grid">
            <div class="form-group">
              <label for="kind-voornaam" class="form-label">Voornaam <span class="required">*</span></label>
              <input type="text" id="kind-voornaam" class="form-input" required maxlength="100" />
            </div>
            <div class="form-group">
              <label for="kind-familienaam" class="form-label">Familienaam <span class="required">*</span></label>
              <input type="text" id="kind-familienaam" class="form-input" required maxlength="100" />
            </div>
            <div class="form-group" id="kind-geboortejaar-groep">
              <label for="kind-geboortejaar" class="form-label">Geboortejaar <span class="required">*</span></label>
              <input type="number" id="kind-geboortejaar" class="form-input" min="1900" max="2100" />
            </div>
          </div>
          <label class="checkbox-rij">
            <input type="checkbox" id="kind-volwassen" />
            <span>Volwassene — geboortejaar niet nodig</span>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="kind-save-btn">Opslaan</button>
            <button type="button" class="btn btn--outline" id="kind-cancel-btn">Annuleren</button>
            <button type="button" class="btn btn--link btn--verwijder hidden" id="kind-delete-btn">
              Deze verzamelaar verwijderen
            </button>
          </div>
        </form>
        <div id="kind-form-message" class="message" role="alert" aria-live="polite"></div>
      </div>

      <ul id="kinderen-ul" class="kinderen-list"></ul>
      <p id="stats-hint" class="form-meta hidden"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Panini Ruilportaal — Gebouwd op Cloudflare Pages &amp; Supabase</p>
    </div>
  </footer>

  <script type="module" src="/js/supabase.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/kinderen.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
