<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panini Ruilportaal — Kinddetail</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/dashboard.html" class="brand">
        <span class="brand__logo">◆</span>
        <span class="brand__name">Panini Ruilportaal</span>
      </a>
      <div class="navbar__actions">
        <a href="/dashboard.html" class="btn btn--outline btn--sm">← Dashboard</a>
        <button type="button" class="btn btn--outline btn--sm" id="logout-btn">Uitloggen</button>
      </div>
    </div>
  </header>

  <main class="container main">
    <h1 id="kind-naam">Laden…</h1>
    <p id="kind-geboortejaar" class="form-meta"></p>

    <div class="card">
      <h2>Sticker toevoegen</h2>

      <form id="sticker-form" novalidate>
        <input type="hidden" id="sticker-id" />
        <input type="hidden" id="sticker-code" />

        <div class="zoekbalk">
          <div class="form-group zoekbalk__zoek">
            <label for="sticker-zoek" class="form-label">Zoek je sticker</label>
            <input
              type="text"
              id="sticker-zoek"
              class="form-input form-input--groot"
              placeholder="Typ een nummer, code of naam — bv. 7, BEL7 of Courtois"
              autocomplete="off"
            />
          </div>

          <div class="form-group zoekbalk__land">
            <label for="sticker-land" class="form-label">Filter op land</label>
            <select id="sticker-land" class="form-input">
              <option value="">Alle landen</option>
            </select>
          </div>
        </div>

        <p class="sticker-instructie">Tik één sticker aan en klik daarna op Toevoegen.</p>
        <p id="sticker-teller" class="sticker-teller"></p>
        <ul id="sticker-suggesties" class="sticker-suggesties"></ul>

        <div id="sticker-keuze" class="keuzevak hidden">
          <h3 class="keuzevak__titel">Wat wil ik doen?</h3>
          <p class="keuzevak__zin">
            <span class="sticker-gekozen" id="sticker-gekozen-tekst"></span>
            <select id="sticker-status" class="form-input keuzevak__select" required
                    aria-label="Wat wil ik doen met deze sticker?">
              <option value="ZOEKT">zoek ik</option>
              <option value="RUILT">heb ik dubbel</option>
            </select>
          </p>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="sticker-submit-btn" disabled>Toevoegen</button>
            <button type="button" class="btn btn--outline" id="sticker-cancel-btn">Annuleren</button>
          </div>
        </div>
      </form>

      <div id="sticker-message" class="message" role="alert" aria-live="polite"></div>
    </div>

    <div class="sticker-lists">
      <section class="card">
        <h2>Zoek ik</h2>
        <ul id="zoekt-list" class="sticker-list"></ul>
      </section>
      <section class="card">
        <h2>Heb ik dubbel</h2>
        <ul id="ruilt-list" class="sticker-list"></ul>
      </section>
      <section class="card">
        <h2>Iemand heeft het dubbel</h2>
        <p id="match-uitleg" class="form-meta"></p>
        <ul id="match-list" class="sticker-list"></ul>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Panini Ruilportaal — Gebouwd op Cloudflare Pages &amp; Supabase</p>
    </div>
  </footer>

  <script type="module" src="/js/supabase.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/kinderen.js"></script>
  <script type="module" src="/js/stickers.js"></script>
</body>
</html>
